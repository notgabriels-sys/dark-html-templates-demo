<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@yourname — links</title>
<meta name="description" content="All my links in one place.">
<!-- EDIT: name, tagline, and the links list below. Colors in :root. Drop a photo into --avatar or replace the .avatar block. -->
<style>
  :root{
    --bg:#100c0a; --surface:#1c1613; --hair:#332822;
    --ink:#F0E9E2; --mute:#b0a498; --faint:#7a6f64;
    --accent:#FF9E64; --accent-2:#FFC59B; --accent-dim:#5c3c22;
    --sans:'Helvetica Neue',Helvetica,Arial,system-ui,sans-serif;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;background:
      radial-gradient(700px 400px at 50% -8%, rgba(255,158,100,.16), transparent 70%),
      var(--bg);
    color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;
    display:flex;justify-content:center;padding:clamp(40px,9vw,72px) 20px}
  a{color:inherit;text-decoration:none}
  .col{width:100%;max-width:440px;text-align:center}

  .avatar{width:96px;height:96px;border-radius:50%;margin:0 auto 20px;
    background:linear-gradient(135deg,var(--accent),var(--accent-dim));
    display:grid;place-items:center;font-weight:800;font-size:34px;color:#160d07;
    box-shadow:0 0 0 4px rgba(255,158,100,.14)}
  h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
  .handle{font-family:var(--mono);color:var(--accent-2);font-size:14px;margin-top:4px}
  .bio{color:var(--mute);font-size:15px;margin-top:14px;max-width:36ch;margin-inline:auto;line-height:1.55}

  .links{display:grid;gap:12px;margin-top:30px}
  .link{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--hair);
    border-radius:14px;padding:15px 18px;font-weight:600;transition:.15s;text-align:left}
  .link:hover{transform:translateY(-2px);border-color:var(--accent);background:#221a15}
  .link .ic{width:34px;height:34px;flex:none;border-radius:9px;background:var(--accent-dim);color:var(--accent-2);
    display:grid;place-items:center;font-family:var(--mono);font-size:14px}
  .link .t{flex:1}
  .link .t small{display:block;color:var(--mute);font-weight:400;font-size:12.5px;margin-top:1px}
  .link .arw{color:var(--faint);font-size:18px}
  .link.primary{background:var(--accent);color:#160d07;border-color:transparent}
  .link.primary .ic{background:rgba(0,0,0,.15);color:#160d07}
  .link.primary .t small,.link.primary .arw{color:rgba(22,13,7,.7)}

  .socials{display:flex;gap:18px;justify-content:center;margin-top:28px;font-family:var(--mono);font-size:13px;color:var(--mute)}
  .socials a:hover{color:var(--accent-2)}
  footer{margin-top:34px;color:var(--faint);font-family:var(--mono);font-size:12px}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="col">
  <div class="avatar">YN</div> <!-- EDIT: initials, or replace with <img> -->
  <h1>Your Name</h1> <!-- EDIT -->
  <div class="handle">@yourname</div> <!-- EDIT -->
  <p class="bio">Producer & designer. New release out now — everything I make lives below.</p> <!-- EDIT -->

  <div class="links">
    <!-- EDIT: each .link — set href, title, subtitle -->
    <a class="link primary" href="#"><span class="ic">▶</span><span class="t">Latest release<small>Listen now</small></span><span class="arw">↗</span></a>
    <a class="link" href="#"><span class="ic">◈</span><span class="t">Shop / Gumroad<small>Packs, presets & more</small></span><span class="arw">↗</span></a>
    <a class="link" href="#"><span class="ic">✎</span><span class="t">Newsletter<small>Get the next drop first</small></span><span class="arw">↗</span></a>
    <a class="link" href="#"><span class="ic">◐</span><span class="t">Bookings<small>Live & studio enquiries</small></span><span class="arw">↗</span></a>
  </div>

  <div class="socials">
    <a href="#">Instagram</a><a href="#">SoundCloud</a><a href="#">YouTube</a><a href="#">Bandcamp</a>
  </div>
  <footer>© 2026 Your Name</footer>
</main>
</body>
</html>
